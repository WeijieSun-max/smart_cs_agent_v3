name: ${COMPOSE_PROJECT_NAME:-smart-cs-agent}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-assist_gen}
      MYSQL_USER: ${MYSQL_APP_USER:-smartcs}
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_bin
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      - app_network
    logging: *default-logging

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - app_network
    logging: *default-logging

  backend:
    image: ${BACKEND_IMAGE:-smart-cs-agent-backend:latest}
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    environment:
      APP_NAME: ${APP_NAME:-smart-cs-agent}
      DEBUG: "${DEBUG:-false}"
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: "8000"
      LOCAL_USER_ID: ${LOCAL_USER_ID:-local-user}
      QWEN_API_KEY: ${QWEN_API_KEY}
      QWEN_BASE_URL: ${QWEN_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      QWEN_MODEL: ${QWEN_MODEL:-qwen3.7-flash}
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: ${MYSQL_APP_USER:-smartcs}
      DB_PASSWORD: ${MYSQL_APP_PASSWORD}
      DB_NAME: ${MYSQL_DATABASE:-assist_gen}
      PII_ENCRYPTION_KEY: ${PII_ENCRYPTION_KEY}
      REDIS_ENABLED: "true"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      KNOWLEDGE_QDRANT_ENABLED: "${KNOWLEDGE_QDRANT_ENABLED:-false}"
      MEMORY_LAYERED_ENABLED: "${MEMORY_LAYERED_ENABLED:-false}"
      MEMORY_QDRANT_ENABLED: "${MEMORY_QDRANT_ENABLED:-false}"
      MEMORY_WORKER_ENABLED: "${MEMORY_WORKER_ENABLED:-false}"
      QDRANT_URL: ${QDRANT_URL:-}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      LANGFUSE_ENABLED: "${LANGFUSE_ENABLED:-false}"
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-https://cloud.langfuse.com}
      LANGFUSE_CAPTURE_CONTENT: "${LANGFUSE_CAPTURE_CONTENT:-false}"
      LANGFUSE_HASH_SALT: ${LANGFUSE_HASH_SALT}
      IDENTITY_HEADER_ENABLED: "false"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8000"
    volumes:
      - backend_vector_data:/app/data/vector_store
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5)"
      interval: 10s
      timeout: 6s
      retries: 20
      start_period: 30s
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    networks:
      - app_network
    logging: *default-logging

  frontend:
    image: ${FRONTEND_IMAGE:-smart-cs-agent-frontend:latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    networks:
      - app_network
    logging: *default-logging

networks:
  app_network:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  backend_vector_data:
